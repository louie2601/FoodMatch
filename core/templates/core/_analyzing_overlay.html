{% comment %}
Full-screen "Analyzing your file…" card shown while a Similarity Check runs.
Shared by the student and the Admin / Super Admin Similarity Check pages;
their scripts show it when the check form is submitted.
{% endcomment %}
<div
  id="analyzingOverlay"
  class="fixed inset-0 z-[200] hidden items-center justify-center bg-slate-950/60 backdrop-blur-sm px-4"
  role="alert"
  aria-live="assertive"
  aria-busy="true"
>
  <div class="w-full max-w-sm rounded-3xl bg-white px-8 py-9 text-center shadow-[0_30px_80px_rgba(15,23,42,0.35)]">
    <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-50">
      <svg class="h-9 w-9 animate-spin text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke-width="3" class="opacity-25"></circle>
        <path d="M4 12a8 8 0 018-8" stroke-width="3" class="opacity-75" stroke-linecap="round"></path>
      </svg>
    </div>
    <h2 class="mt-5 text-xl font-black tracking-tight text-slate-900">Analyzing your file&hellip;</h2>
    <p class="mt-2 text-sm text-slate-500">Please wait while we check your paper.</p>
  </div>
</div>
