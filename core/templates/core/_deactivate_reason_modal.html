{% load static %}
<div data-deactivate-modal class="fixed inset-0 z-50 hidden items-center justify-center px-4 py-6" role="dialog" aria-modal="true" aria-labelledby="deactivateModalTitle">
  <div data-close-deactivate-modal class="absolute inset-0 bg-slate-950/50 backdrop-blur-sm"></div>
  <form data-deactivate-modal-form class="relative z-10 w-full max-w-lg overflow-hidden rounded-[1.5rem] border border-white/70 bg-white shadow-[0_30px_80px_rgba(15,23,42,0.3)]">
    <div class="h-1 bg-gradient-to-r from-amber-500 via-orange-500 to-amber-600"></div>
    <div class="flex items-start gap-4 px-6 pt-5 pb-4">
      <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-amber-100 text-amber-700">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="m5.6 5.6 12.8 12.8"></path>
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-amber-700">Deactivate Account</p>
        <h3 id="deactivateModalTitle" class="mt-0.5 text-xl font-black tracking-tight text-slate-900">Deactivate <span data-deactivate-target class="text-amber-700">this account</span>?</h3>
        <p class="mt-1 text-sm text-slate-600">They won't be able to sign in. The reason below is emailed to them and shown when they try to sign in.</p>
      </div>
    </div>
    <div class="px-6 pb-5">
      <label for="deactivateReason" class="block text-sm font-semibold text-slate-700">Reason for deactivation <span class="text-rose-500">*</span></label>
      <textarea id="deactivateReason" data-deactivate-reason required maxlength="500" rows="4" placeholder="e.g. The group has graduated and the account is no longer in use."
        class="mt-1.5 w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-amber-500 focus:ring-4 focus:ring-amber-100"></textarea>
      <p class="mt-1 text-xs text-slate-500">Up to 500 characters.</p>
    </div>
    <div class="flex items-center justify-end gap-3 border-t border-slate-100 bg-slate-50/60 px-6 py-3">
      <button type="button" data-close-deactivate-modal class="inline-flex items-center justify-center rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50">Cancel</button>
      <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-amber-500 to-orange-600 px-5 py-2.5 text-sm font-semibold text-white shadow-md shadow-amber-200 transition hover:-translate-y-0.5">Deactivate and notify</button>
    </div>
  </form>
</div>
<script src="{% static 'core/js/pages/deactivate-reason-modal.js' %}"></script>
