upstream django {
    server web:8000;
}

server {
    listen 80;

    # Research files plus up to 10 announcement images of 5 MB each.
    client_max_body_size 60M;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # Only landing page images are public. Every other upload (research
    # submissions, pending files) goes through Django's permission checks.
    location /media/landing/ {
        alias /app/media/landing/;
        expires 7d;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        # Overwritten, not appended, so a visitor can't fake the IP the activity logs record.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
