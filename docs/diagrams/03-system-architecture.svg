<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="System Architecture of FOOD MATCH">
<title>System Architecture of FOOD MATCH</title>
