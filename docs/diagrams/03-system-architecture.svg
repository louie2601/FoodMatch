<text x="840.0" y="745.0" font-size="12" font-weight="normal" fill="#475569" text-anchor="start">send email (SMTP)</text>
<text x="40.0" y="910.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Uploaded research files are opened only through Django, which checks who is asking; nginx serves only CSS, JavaScript and landing page images.</text>
