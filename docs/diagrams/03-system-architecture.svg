<rect x="58.0" y="344.0" width="174.0" height="34.0" rx="17" fill="#ffffff" stroke="#0369a1" stroke-width="1.2"/>
<text x="145.0" y="366.0" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Admin</text>
<rect x="58.0" y="390.0" width="174.0" height="34.0" rx="17" fill="#ffffff" stroke="#0369a1" stroke-width="1.2"/>
<text x="145.0" y="412.0" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Super Admin</text>
<text x="145.0" y="452.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">HTML, Tailwind CSS,</text>
<text x="145.0" y="469.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">JavaScript, Chart.js</text>
<rect x="325.0" y="200.0" width="220.0" height="330.0" rx="14" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="435.0" y="232.0" font-size="17" font-weight="bold" fill="#0f172a" text-anchor="middle">nginx</text>
<text x="435.0" y="252.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Reverse proxy</text>
<circle cx="347" cy="285.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="290.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Receives every request</text>
<circle cx="347" cy="308.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="313.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Serves CSS and JavaScript</text>
<text x="357.0" y="329.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">files</text>
<circle cx="347" cy="347.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="352.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Serves landing page</text>
<text x="357.0" y="368.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">images directly from</text>
<text x="357.0" y="384.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">media storage</text>
<circle cx="347" cy="402.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="407.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Forwards other requests</text>
<text x="357.0" y="423.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">to Django</text>
<circle cx="347" cy="441.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="446.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Passes the visitor&#x27;s real</text>
<text x="357.0" y="462.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">IP address</text>
<circle cx="347" cy="480.5" r="2.4" fill="#0f172a"/>
<text x="357.0" y="485.0" font-size="12.5" font-weight="normal" fill="#0f172a" text-anchor="start">Upload limit 60 MB</text>
<rect x="620.0" y="160.0" width="420.0" height="530.0" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
<text x="830.0" y="190.0" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Gunicorn + Django 4.2 (Python 3.12)</text>
<rect x="636.0" y="210.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="650.0" y="238.0" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">URL routing and views</text>
<text x="650.0" y="260.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">20 modules: public</text>
<text x="650.0" y="277.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">site, student and admin</text>
<text x="650.0" y="294.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">portals</text>
<rect x="838.0" y="210.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="852.0" y="238.0" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">Access control</text>
<text x="852.0" y="260.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Login lockout, roles,</text>
<text x="852.0" y="277.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Admin module</text>
<text x="852.0" y="294.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">privileges, CSRF</text>
<rect x="636.0" y="366.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2"/>
<text x="650.0" y="394.0" font-size="14" font-weight="bold" fill="#047857" text-anchor="start">Similarity engine</text>
<text x="650.0" y="416.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">PyPDF2 / python-docx</text>
<text x="650.0" y="433.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">text, section</text>
<text x="650.0" y="450.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">detection, TF-IDF and</text>
<text x="650.0" y="467.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">cosine similarity</text>
<text x="650.0" y="484.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">(scikit-learn)</text>
<rect x="838.0" y="366.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="852.0" y="394.0" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">File handling</text>
<text x="852.0" y="416.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Upload checks,</text>
<text x="852.0" y="433.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Tesseract OCR, Pillow</text>
<text x="852.0" y="450.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">image resizing,</text>
<text x="852.0" y="467.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">protected document</text>
<text x="852.0" y="484.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">access</text>
<rect x="636.0" y="522.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="650.0" y="550.0" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">Notifications and logs</text>
<text x="650.0" y="572.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">In-app notifications,</text>
<text x="650.0" y="589.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">login and activity logs</text>
<rect x="838.0" y="522.0" width="186.0" height="144.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="852.0" y="550.0" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="start">Reports</text>
<text x="852.0" y="572.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">Summary figures, chart</text>
<text x="852.0" y="589.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="start">data, CSV export</text>
