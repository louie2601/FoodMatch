<text x="1235.0" y="522.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">(served only after a permission check)</text>
<text x="1235.0" y="538.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">Landing page images (public)</text>
