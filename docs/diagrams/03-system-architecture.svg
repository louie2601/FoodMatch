<text x="1235.0" y="308.0" font-size="12.5" font-weight="normal" fill="#475569" text-anchor="middle">settings (22 tables)</text>
<path d="M1110 444 V566 A125.0 14 0 0 0 1360 566 V444" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/><ellipse cx="1235.0" cy="444" rx="125.0" ry="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
