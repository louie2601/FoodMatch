<text x="435.0" y="104.0" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">WEB TIER</text>
<text x="830.0" y="104.0" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">APPLICATION TIER</text>
<text x="1235.0" y="104.0" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">DATA TIER</text>
